name: CI

on:
  push:
    branches: [develop, feature/ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git .

      - name: Check Python
        run: python3 --version

      - name: Install uv
        run: pipx install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Dependency audit
        continue-on-error: true 
        run: |
          uv export --frozen --no-hashes --no-emit-project > audit-requirements.txt
          uvx pip-audit -r audit-requirements.txt --no-deps --disable-pip > audit.log
      
      - name: Save audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-log
          path: audit.log