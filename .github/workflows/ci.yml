name: CI

on:
  push:
    branches: [develop, feature/ci]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Create tests/.env
        run: |
          cat > tests/.env <<'EOF'
          BOT_TOKEN=123456789:TEST_TOKEN_FOR_CI
          JWT_SECRET=test-jwt-secret
          JWT_ACCESS_TOKEN_EXPIRE=30
          REDIS_HOST=localhost
          REDIS_PORT=6379
          EOF

      - name: Run unit tests
        run: uv run pytest -v

