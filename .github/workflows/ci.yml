name: CI

on:
  push:
    branches: [develop, feature/ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git .

      - name: Check Python
        run: python3 --version

      - name: Install uv
        run: pipx install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Dependency audit
        continue-on-error: true 
        run: |
          uv export --frozen --no-hashes --no-emit-project > audit-requirements.txt
          uvx pip-audit -r audit-requirements.txt --no-deps --disable-pip \
            || echo "::warning::pip-audit found vulnerabilities, see the log above"
      
      - name: Save audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-log
          path: audit.log
          
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p odc-report && chmod 777 odc-report 
          docker run --rm \
            -v "$PWD/.venv":/src \
            -v "$PWD/odc-report":/report \
            owasp/dependency-check:latest \
            --scan /src \
            --out /report \
            --format ALL \
            --prettyPrint \
            --failOnCVSS 9 \
            --nvdApiKey "$NVD_API_KEY"

      - name: Save OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odc-report
          path: odc-report/

      - name: Run unit tests
        run: uv run pytest -v
      